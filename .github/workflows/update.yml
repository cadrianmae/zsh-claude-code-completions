name: Update completions

# Regenerate _claude against the latest Claude Code release.
#
# Generation is deterministic and needs no credentials, so the result is
# either byte-identical to what a human would produce or it is wrong in a way
# verify.sh catches. That makes it safe to commit straight to main rather than
# parking a PR nobody reviews. Anything that fails opens an issue instead.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-completions
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          # The installer has used more than one location over time; add the
          # candidates rather than pinning one.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.claude/bin" >> "$GITHUB_PATH"

      - name: Record versions
        id: versions
        run: |
          old=$(cat claude-version 2>/dev/null || echo none)
          new=$(claude --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "committed _claude targets $old; latest CLI is $new"

      - name: Regenerate
        run: ./bin/gen-completion

      - name: Seed state for the dynamic-helper checks
        run: ./scripts/seed-test-state.sh

      - name: Verify
        run: ./scripts/verify.sh

      - name: Commit
        id: commit
        run: |
          if git diff --quiet; then
            echo "no change; _claude is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate completions for claude ${{ steps.versions.outputs.new }}" \
                     -m "Was built for ${{ steps.versions.outputs.old }}. Generated by bin/gen-completion; verify.sh passed."
          git push

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Completions"
            echo
            echo "- previous: \`${{ steps.versions.outputs.old }}\`"
            echo "- latest:   \`${{ steps.versions.outputs.new }}\`"
            echo "- updated:  \`${{ steps.commit.outputs.changed || 'no' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A silent daily failure is the failure mode that matters here: the
      # completion quietly rots while the badge stays green in memory.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automatic completion update failed';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled regeneration failed against Claude Code \`${{ steps.versions.outputs.new }}\`.`,
              '',
              `Run: ${url}`,
              '',
              'Likely causes: the CLI changed its `--help` layout, a new subcommand',
              'collides with a helper name, or a completion stopped firing.',
              '',
              'Reproduce locally with `just build`.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated',
            });
            const open = existing.data.find(i => i.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['automated'],
              });
            }
